<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congresso Unificado 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header class="header">
            <p id="boas-vindas" class="boas-vindas">Seja bem-vindo ao nosso</p>
            <img src="logo.png" alt="Logo Congresso Unificado 2026" class="logo">
        </header>

        <section class="card-versiculo" id="card-versiculo">
            <div class="aspas">“</div>
            <p id="texto-versiculo" class="texto">Carregando uma palavra para você...</p>
            <p id="ref-versiculo" class="referencia"></p>
            <span class="dica-copiar">Toque no card para copiar</span>
        </section>

        <div class="acoes">
            <!-- Botão do Instagram com o link atualizado -->
            <a href="https://www.instagram.com/assembleia_caxingo?stkn=MWtkcW5oNjUxOWd5Zw==" target="_blank" class="btn-instagram">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                Siga a Igreja no Instagram
            </a>
        </div>
    </main>

    <!-- Notificação Flutuante (Toast) -->
    <div id="toast" class="toast">Versículo copiado!</div>

    <script src="script.js"></script>
</body>
</html>

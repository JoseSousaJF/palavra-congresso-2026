<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Congresso Unificado 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header class="header">
            <span class="subtag">Congresso Unificado 2026</span>
            <h1 class="tema">"O céu responde à busca sincera."</h1>
        </header>

        <section class="card-versiculo">
            <div class="aspas">“</div>
            <p id="texto-versiculo" class="texto">Carregando uma palavra para você...</p>
            <p id="ref-versiculo" class="referencia"></p>
        </section>

        <button id="btn-outro" onclick="sortearVersiculo()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l5.67-5.67"/>
            </svg>
            Receber outra palavra
        </button>
    </main>

    <script src="script.js"></script>

</html>
